stereo_depth:
  ros__parameters:
    left_topic: /welding_robot/camera_650/image_raw
    right_topic: /welding_robot/camera_450/image_raw
    left_optical_frame: camera_650_optical_frame
    expected_calibration_package_id: ""
    stereo_yaml: ""
    left_intrinsics_yaml: ""
    left_handeye_yaml: ""
    right_intrinsics_yaml: ""
