    left_right_maximum_difference_px: 2
    disparity_margin_px: 16
    maximum_num_disparities: 512
    enable_left_right_check: false
    enable_clahe: true
    clahe_clip_limit: 10.0
    multi_band_enabled: true
    multi_band_minimum_depths_mm: [300.0, 600.0, 1200.0]
    multi_band_maximum_depths_mm: [600.0, 1200.0, 2500.0]
    point_stride: 2
    minimum_valid_fraction: 0.02
